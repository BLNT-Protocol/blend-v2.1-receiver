[package]
name = "blend-v2-1-receiver"
version = "0.1.0"
edition = "2021"
rust-version = "1.91.1"
license = "AGPL-3.0"
description = "Purpose-built intermediate receiver for the Blend V2 to V2.1 emitter migration"
repository = "https://github.com/BLNT-Protocol/blend-v2.1-receiver"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[features]
testutils = ["soroban-sdk/testutils"]

[dependencies]
soroban-sdk = "=27.0.3"

[dev-dependencies]
soroban-sdk = { version = "=27.0.3", features = ["testutils"] }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
